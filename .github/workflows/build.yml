name: Build

# Compiles the kernel driver with the WDK and runs the host-side unit tests on
# every push / pull request, so a change that does not build is caught before
# anyone installs it. Modeled on the WDK workflow of
# osaul4ik/apple-t2-touchid-windows. The built .sys is unsigned (test-sign it
# locally before installing); no secrets are used.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests-linux:
    name: Host tests (gcc, clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          set -e
          for cc in gcc clang; do
            for t in BceProtocolLogicTest T2AudioBufferLogicTest T2AudioSpeakerLogicTest T2AudioPipelineTest T2AudioDspTest T2AudioCrashGuardTest T2AudioMicTest; do
              $cc -Wall -Wextra -Werror -o "$t-$cc" "tests/$t.c" -lm
              "./$t-$cc"
            done
          done

  driver:
    name: Driver (WDK, Release x64) + host tests (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Official WDK installer, as in osaul4ik/apple-t2-touchid-windows.
      - name: Install WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2085767" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/quiet /norestart" -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Write-Error "WDK installer exited with code $($proc.ExitCode)"
          }

      - name: Build driver
        shell: pwsh
        run: |
          msbuild src\T2AudioMiniport.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /nologo /verbosity:minimal /clp:Summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path src\bin\Release\T2AudioMiniport.sys)) {
            Write-Error "T2AudioMiniport.sys was not produced"
          }

      - name: Host tests (MSVC)
        shell: cmd
        run: |
          cl /nologo /W4 /Fe:tests\BceProtocolLogicTest.exe tests\BceProtocolLogicTest.c || exit /b 1
          tests\BceProtocolLogicTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioBufferLogicTest.exe tests\T2AudioBufferLogicTest.c || exit /b 1
          tests\T2AudioBufferLogicTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioSpeakerLogicTest.exe tests\T2AudioSpeakerLogicTest.c || exit /b 1
          tests\T2AudioSpeakerLogicTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioPipelineTest.exe tests\T2AudioPipelineTest.c || exit /b 1
          tests\T2AudioPipelineTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioDspTest.exe tests\T2AudioDspTest.c || exit /b 1
          tests\T2AudioDspTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioCrashGuardTest.exe tests\T2AudioCrashGuardTest.c || exit /b 1
          tests\T2AudioCrashGuardTest.exe || exit /b 1
          cl /nologo /W4 /Fe:tests\T2AudioMicTest.exe tests\T2AudioMicTest.c || exit /b 1
          tests\T2AudioMicTest.exe || exit /b 1

      # The WASAPI tools embed C# in a here-string compiled by Add-Type at run
      # time; compile it here (Windows PowerShell 5.1, as on the test machine)
      # without running anything, so a typo cannot first show up on hardware.
      - name: Compile C# embedded in tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'tools\Test-WasapiRender.ps1', 'tools\Test-WasapiTone.ps1', 'tools\T2Audio-Setup.ps1') {
            $text = Get-Content -Raw $f
            $m = [regex]::Match($text, "(?s)\`$code = @'\r?\n(.*?)\r?\n'@")
            if (-not $m.Success) { throw "no `$code here-string in $f" }
            Add-Type -TypeDefinition $m.Groups[1].Value
            Write-Host "compiled: $f"
          }

      # Parse every tool script (syntax errors fail the build) and check the
      # installer's preset table: it is evaluated on its own, every -Preset
      # name must exist, 'macos' must equal the driver defaults, and every
      # value must be inside the range the driver accepts.
      - name: Parse tools and check installer presets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          foreach ($f in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad parse error(s)" }
          $text = Get-Content -Raw -Encoding UTF8 tools\T2Audio-Setup.ps1
          $start = $text.IndexOf('$PresetValueNames = ')
          $end = $text.IndexOf('$Presets = [ordered]')
          $end = $text.IndexOf("`n}", $end) + 2
          Invoke-Expression $text.Substring($start, $end - $start)
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$null)
          $names = $ast.ParamBlock.Parameters | Where-Object { $_.Name.VariablePath.UserPath -eq 'Preset' } |
            ForEach-Object { $_.Attributes } | Where-Object { $_.TypeName.Name -eq 'ValidateSet' } |
            ForEach-Object { $_.PositionalArguments.Value }
          if (@($names).Count -ne $Presets.Count) { throw "ValidateSet has $(@($names).Count) names, table has $($Presets.Count)" }
          $ranges = @{ SpeakerDsp = 0, 4; DspGainDb = 0, 12; TweeterTrimDb = 0, 12; WooferLimitDb = 0, 12; DspAutoGain = 0, 1;
                       BassDb = -12, 12; TrebleDb = -12, 12; ClarityDb = -12, 12; CompStyle = 0, 1 }
          foreach ($n in $names) {
            if (-not $Presets.Contains($n)) { throw "preset '$n' missing from the table" }
            foreach ($k in $PresetValueNames) {
              $v = $Presets[$n].Values[$k]
              if ($null -eq $v -or $v -lt $ranges[$k][0] -or $v -gt $ranges[$k][1]) { throw "preset '$n': $k=$v out of range" }
            }
            Write-Host ("{0,-14} {1}" -f $n, (($PresetValueNames | ForEach-Object { "$_=$($Presets[$n].Values[$_])" }) -join ' '))
          }
          foreach ($k in $PresetValueNames) {
            if ($Presets['macos'].Values[$k] -ne $ParamDefaults[$k]) { throw "macos preset differs from the driver default in $k" }
          }

      # Report-only for now (continue-on-error): findings are listed in the log
      # and turned into blocking checks once the existing ones are fixed.
      - name: PSScriptAnalyzer (report only)
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Invoke-ScriptAnalyzer -Path tools -Severity Error -Recurse | Format-Table -AutoSize | Out-String -Width 200

      - name: InfVerif (report only)
        continue-on-error: true
        shell: pwsh
        run: |
          $iv = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Tools' -Recurse -Filter infverif.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $iv) { Write-Warning 'infverif.exe not found'; exit 0 }
          & $iv.FullName /v packaging\T2AudioMiniport.inf
          exit $LASTEXITCODE

      - name: Upload unsigned driver
        uses: actions/upload-artifact@v4
        with:
          name: T2AudioMiniport-unsigned-${{ github.sha }}
          path: |
            src/bin/Release/T2AudioMiniport.sys
            src/bin/Release/T2AudioMiniport.pdb
          if-no-files-found: warn

      # WDK code analysis, report only. Runs after the upload so the uploaded
      # binary always comes from the plain Release build above.
      - name: WDK code analysis (report only)
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild src\T2AudioMiniport.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:RunCodeAnalysis=true `
            /t:Rebuild /nologo /verbosity:minimal
